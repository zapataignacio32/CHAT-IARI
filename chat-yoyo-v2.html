<style>

header .n{flex:1;min-width:0;cursor:pointer}header b{display:block;font-size:17px}header small{color:var(--sub);font-size:12.5px}
svg{flex:none}.ic{width:24px;height:24px;fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@keyframes fl{0%,60%{background:#00a88455}100%{background:transparent}}

#send svg{width:22px;height:22px;stroke:#fff;fill:#fff}
#emo{display:none;grid-template-columns:repeat(8,1fr);background:var(--bar);padding:6px 8px;gap:2px;border-top:1px solid var(--ln)}

.ov{position:fixed;inset:0;background:var(--bar);z-index:40;display:none;overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}

.big{text-align:center;padding:4px 0 14px}.big b{display:block;font-size:26px;margin-top:12px}.big span{color:var(--sub)}
.sr{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:var(--in);border-radius:14px;padding:12px 40px;margin-top:16px;color:var(--ac);font-size:14px}
.card{background:var(--in);margin:12px;border-radius:16px;overflow:hidden}
.card button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ln);text-align:left;font-size:16px}.card button:last-child{border:0}.card span{color:var(--sub)}.red{color:#ea0038!important}
.li{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--in);border-bottom:1px solid var(--ln);cursor:pointer}
.li .th{width:52px;height:52px;border-radius:8px;background:var(--bar);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.li div:last-child{min-width:0}.li p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--sub)}
.em{text-align:center;color:var(--sub);padding:40px 20px}
#view{background:#000;z-index:70;align-items:center;justify-content:center}#view img{max-width:100%;max-height:100%}
#sh{position:fixed;inset:0;z-index:80;display:none}#sh .bd{position:absolute;inset:0;background:#0006}
#sh .pn{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#sh .g{background:var(--in);border-radius:14px;overflow:hidden}#sh .g p{margin:0;text-align:center;color:var(--sub);font-size:13px;padding:12px}
#sh button{display:block;width:100%;padding:15px;font-size:17px;border-top:1px solid var(--ln);color:var(--ac);text-align:center}#sh .c{background:var(--in);border-radius:14px;font-weight:600;border:0}
#to{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222c;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:90;display:none;max-width:85%;text-align:center}
</style></head><body>
<div id="app">

<script>
var db,mem=[],A=[],q='',last='',U={};
function $(i){return document.getElementById(i)}
var box=$('msgs'),t=$('t');
function toast(s){var e=$('to');e.textContent=s;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},2200)}
function open(){return new Promise(function(r){try{var x=indexedDB.open('yoyo-chat',1);x.onupgradeneeded=function(){x.result.createObjectStore('m',{keyPath:'id'})};x.onsuccess=function(){db=x.result;r()};x.onerror=function(){r()}}catch(e){r()}})}
function all(){return new Promise(function(r){if(!db)return r(mem.slice());var x=db.transaction('m').objectStore('m').getAll();x.onsuccess=function(){r(x.result.sort(function(a,b){return a.id-b.id}))};x.onerror=function(){r([])}})}
function put(m){return new Promise(function(r){if(!db){mem=mem.filter(function(o){return o.id!=m.id});mem.push(m);return r()}var x=db.transaction('m','readwrite');x.objectStore('m').put(m);x.oncomplete=r;x.onerror=r})}
function rm(id){return new Promise(function(r){if(!db){mem=mem.filter(function(o){return o.id!=id});return r()}var x=db.transaction('m','readwrite');x.objectStore('m').delete(id);x.oncomplete=r;x.onerror=r})}
function clr(){return new Promise(function(r){mem=[];if(!db)return r();var x=db.transaction('m','readwrite');x.objectStore('m').clear();x.oncomplete=r;x.onerror=r})}
function day(d){var a=new Date(),b=new Date(d);if(a.toDateString()==b.toDateString())return 'Hoy';if(new Date(a-864e5).toDateString()==b.toDateString())return 'Ayer';return b.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})}
function hm(d){return new Date(d).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})}
function sz(n){return n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function u(m){return U[m.id]||(U[m.id]=URL.createObjectURL(m.blob))}
function pill(s){var p=document.createElement('div');p.className='pill';p.textContent=s;box.appendChild(p)}
function link(el,s){s.split(/(https?:\/\/[^\s]+)/g).forEach(function(p,i){if(i%2){var a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener';a.textContent=p;a.addEventListener('touchstart',function(e){e.stopPropagation()},{passive:true});el.appendChild(a)}else el.appendChild(document.createTextNode(p))})}
function sheet(title,items){var p=document.querySelector('#sh .pn');p.innerHTML='';var g=document.createElement('div');g.className='g';if(title){var h=document.createElement('p');h.textContent=title;g.appendChild(h)}
 items.forEach(function(it){var b=document.createElement('button');b.textContent=it[0];if(it[2])b.className='red';b.onclick=function(){$('sh').style.display='none';it[1]()};g.appendChild(b)});
 var c=document.createElement('button');c.className='c';c.textContent='Cancelar';c.onclick=function(){$('sh').style.display='none'};p.appendChild(g);p.appendChild(c);$('sh').style.display='block'}
function actions(m){var it=[];if(m.text)it.push(['Copiar',function(){try{navigator.clipboard.writeText(m.text);toast('Copiado')}catch(e){toast('No se pudo copiar')}}]);
 it.push([m.star?'Quitar de destacados':'Destacar',async function(){m.star=!m.star;await put(m);load(1)}]);
 it.push(['Eliminar',async function(){await rm(m.id);load(1)},1]);sheet('',it)}
function draw(m){
 var d=day(m.id);if(d!=last){last=d;pill(d)}
 var r=document.createElement('div');r.className='row out';r.dataset.id=m.id;var b=document.createElement('div');b.className='b';
 if(m.k=='img'){var i=document.createElement('img');i.src=u(m);i.alt='';i.onclick=function(){$('vi').src=i.src;$('view').style.display='flex'};b.appendChild(i)}
 if(m.k=='vid'){var v=document.createElement('video');v.src=u(m);v.controls=true;v.playsInline=true;v.preload='metadata';b.appendChild(v)}
 if(m.k=='file'){var f=document.createElement('div');f.className='f';var e=document.createElement('em');e.textContent='📄';var s=document.createElement('span');s.textContent=m.name;var g=document.createElement('small');g.textContent=sz(m.blob.size)+' · '+((m.name.split('.').pop()||'').toUpperCase().slice(0,5));s.appendChild(g);f.appendChild(e);f.appendChild(s);b.appendChild(f)}
 if(m.text)link(b,m.text);
 var mt=document.createElement('span');mt.className='m';mt.innerHTML=(m.star?'<s>★</s>':'')+hm(m.id)+'<i>✓✓</i>';b.appendChild(mt);
 var tm;b.addEventListener('touchstart',function(){tm=setTimeout(function(){actions(m)},500)},{passive:true});
 ['touchend','touchmove','touchcancel'].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(tm)},{passive:true})});
 b.addEventListener('contextmenu',function(ev){ev.preventDefault();actions(m)});
 r.appendChild(b);box.appendChild(r)}
async function load(keep){var pos=box.scrollTop,atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<120;A=await all();box.innerHTML='';last='';
 if(!q)pill('Los mensajes se guardan solo en este dispositivo.');
 var f=q?A.filter(function(m){return((m.text||'')+' '+(m.name||'')).toLowerCase().indexOf(q)>-1}):A;
 if(q&&!f.length)pill('No se encontraron resultados');
 f.forEach(draw);box.scrollTop=(keep&&!atEnd)?pos:box.scrollHeight;stats()}
function stats(){var fs=A.filter(function(m){return m.blob}),st=A.filter(function(m){return m.star}),n=fs.reduce(function(s,m){return s+m.blob.size},0);
 $('cf').textContent=fs.length+' ›';$('cs').textContent=sz(n)+' ›';$('cd').textContent=st.length+' ›'}
async function add(m){m.id=Date.now()+Math.random()/1000;await put(m);await load()}
async function sendText(){var v=t.value.trim();if(!v)return;t.value='';t.style.height='24px';fade();await add({k:'txt',text:v})}
function fade(){$('send').style.opacity=t.value.trim()?1:.55}
function files(e,img){Array.prototype.forEach.call(e.target.files,async function(f){var k='file';if(img&&f.type.indexOf('image')==0)k='img';else if(img&&f.type.indexOf('video')==0)k='vid';await add({k:k,name:f.name,blob:f})});e.target.value=''}
function list(title,arr){$('ls').querySelector('h3').textContent=title;var c=$('lc');c.innerHTML='';
 if(!arr.length){c.innerHTML='<p class="em">Nada por aquí todavía</p>'}
 arr.slice().reverse().forEach(function(m){var d=document.createElement('div');d.className='li';var th=document.createElement('div');th.className='th';
  if(m.k=='img'){var i=document.createElement('img');i.src=u(m);th.appendChild(i)}else th.textContent=m.k=='vid'?'🎬':m.k=='file'?'📄':'💬';
  var x=document.createElement('div'),p=document.createElement('p');p.textContent=m.name||m.text||'';var s=document.createElement('small');s.textContent=day(m.id)+' · '+hm(m.id)+(m.blob?' · '+sz(m.blob.size):'');x.appendChild(p);x.appendChild(s);d.appendChild(th);d.appendChild(x);
  d.onclick=function(){if(m.k=='img'){$('vi').src=u(m);$('view').style.display='flex';return}$('ls').style.display='none';$('info').style.display='none';q='';$('sb').style.display='none';$('si').value='';
   load().then(function(){var el=box.querySelector('[data-id="'+m.id+'"]');if(el){el.scrollIntoView({block:'center'});el.classList.add('fl')}})};c.appendChild(d)});$('ls').style.display='block'}
function theme(v){var r=document.documentElement;if(v=='light'||v=='dark')r.setAttribute('data-theme',v);else r.removeAttribute('data-theme');$('ct').textContent=(v=='light'?'Claro':v=='dark'?'Oscuro':'Automático')+' ›';try{localStorage.setItem('yoyo-theme',v||'auto')}catch(e){}}
$('send').onclick=sendText;
t.addEventListener('input',function(){t.style.height='24px';t.style.height=Math.min(t.scrollHeight,110)+'px';fade()});
$('plus').onclick=function(){var m=$('menu');m.style.display=m.style.display=='block'?'none':'block'};
$('bph').onclick=function(){$('menu').style.display='none';$('ph').click()};
$('bfi').onclick=function(){$('menu').style.display='none';$('fi').click()};
$('bcm').onclick=function(){$('menu').style.display='none';$('cm').click()};
$('cam').onclick=function(){$('cm').click()};
$('ph').onchange=function(e){files(e,true)};$('cm').onchange=function(e){files(e,true)};$('fi').onchange=function(e){files(e,false)};
document.addEventListener('click',function(e){if(!e.target.closest('#menu,#plus'))$('menu').style.display='none'});
var E='😀😂😍🥰😘😎🤔😅😭😡👍👎🙏👏🙌💪🔥✨🎉❤️💔😴🤗😉😊🥳😱🤝👀✅❌🎂🍕☕🚗🏠📞'.match(/\p{Extended_Pictographic}(\uFE0F)?/gu)||[];
E.forEach(function(x){var b=document.createElement('button');b.textContent=x;b.onclick=function(){var s=t.selectionStart||t.value.length;t.value=t.value.slice(0,s)+x+t.value.slice(t.selectionEnd||s);t.focus();t.selectionStart=t.selectionEnd=s+x.length;fade()};$('emo').appendChild(b)});
$('eb').onclick=function(){var e=$('emo');e.style.display=e.style.display=='grid'?'none':'grid'};
document.querySelectorAll('.cl').forEach(function(b){b.onclick=function(){toast('Las llamadas no están disponibles en esta réplica')}});
$('bk').onclick=function(){box.scrollTop=box.scrollHeight};
function openInfo(){$('info').style.display='block'}
$('hn').onclick=openInfo;$('av').onclick=openInfo;$('ci').onclick=function(){$('info').style.display='none'};
$('cls').onclick=function(){$('ls').style.display='none'};$('view').onclick=function(){$('view').style.display='none'};
$('bs').onclick=function(){$('info').style.display='none';$('sb').style.display='flex';$('si').focus()};
$('si').oninput=function(){q=this.value.trim().toLowerCase();load()};
$('sx').onclick=function(){q='';$('si').value='';$('sb').style.display='none';load()};
$('ig').onclick=function(){list('Archivos, enlaces y docs',A.filter(function(m){return m.blob||/https?:\/\//.test(m.text||'')}))};
$('is').onclick=function(){list('Destacados',A.filter(function(m){return m.star}))};
$('ia').onclick=function(){list('Almacenamiento',A.filter(function(m){return m.blob}))};
$('it').onclick=function(){sheet('Estilo del chat',[['Automático',function(){theme('auto')}],['Claro',function(){theme('light')}],['Oscuro',function(){theme('dark')}]])};
